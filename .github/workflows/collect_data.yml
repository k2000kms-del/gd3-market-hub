name: Market Data Auto Collector & Cloud Notifier

on:
  push:
    branches: [ main ]
  schedule:
    # 1. ☀️ 아침 출근 모닝 브리핑 (KST 07:50, 07:55, 08:00, 08:05, 08:10 = UTC 22:50, 22:55, 23:00, 23:05, 23:10) 평일 5단 안전망
    - cron: '50,55 22 * * 0-4'
    - cron: '0,5,10 23 * * 0-4'
    # 2. 한국 정규장 5분 초정밀 스케줄 (KST 09:00~15:30 = UTC 00:00~06:30) 평일 5분마다 실행
    # → 장중 하루 최대 78회, 4번 패널 일중 수급 5분 단위 초정밀 누적 + 실시간 텔레그램 감시
    - cron: '*/5 0-5 * * 1-5'
    - cron: '0,5,10,15,20,25,30 6 * * 1-5'
    # 3. 장 마감 및 마감 브리핑 (KST 15:35, 15:40, 15:45, 16:00 = UTC 06:35, 06:40, 06:45, 07:00) 4단 안전망
    - cron: '35,40,45 6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Data Collector
        env:
          KIS_APP_KEY:       ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:    ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python data_collector.py

      - name: Run Cloud Telegram Notifier & Portfolio Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
        run: python cloud_runner.py

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json streamlit_app/data/*.csv streamlit_app/data/*.json
          git diff --staged --quiet || git commit -m "chore: 시장 데이터 및 수급 5분 자동 업데이트 $(date +'%Y-%m-%d %H:%M KST')"
          git push

      - name: Summarize execution
        if: always()
        run: echo "5-minute Cloud Collection & Notification completed successfully!"