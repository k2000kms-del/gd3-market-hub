name: Market Data Auto Collector & Cloud Notifier

on:
  push:
    branches: [ main ]
  schedule:
    # 1. ☀️ 아침 출근 모닝 브리핑 & 장전 시황 감시 (KST 07:00 ~ 08:55 = UTC 22:00 ~ 23:55)
    - cron: '0,15,30,45 22 * * 0-4'
    - cron: '50,55 22 * * 0-4'
    - cron: '*/5 23 * * 0-4'
    # 2. 📈 한국 정규장 실시간 감시 & 5분 수급 누적 (KST 09:00 ~ 15:45 5분마다 = UTC 00:00~06:45)
    # → 09:00~09:15 개장 15분 및 장중 점핑 양봉/외부 채널 속보 실시간 5분 연속 감시
    - cron: '*/5 0-5 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45 6 * * 1-5'
    # 3. 🌙 장 마감 최종 결산 및 퀀트 TOP3 정리 (KST 16:00 = UTC 07:00)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Data Collector
        continue-on-error: true          # ← 데이터 수집 실패해도 텔레그램 알림은 반드시 실행
        env:
          KIS_APP_KEY:       ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:    ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python data_collector.py

      - name: Run Cloud Telegram Notifier & Portfolio Monitor
        if: always()                     # ← 데이터 수집 단계 결과와 무관하게 항상 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
        run: python cloud_runner.py

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json streamlit_app/data/*.csv streamlit_app/data/*.json
          git diff --staged --quiet || git commit -m "chore: 시장 데이터 및 수급 5분 자동 업데이트 $(date +'%Y-%m-%d %H:%M KST')"
          git push

      - name: Summarize execution
        if: always()
        run: echo "5-minute Cloud Collection & Notification completed successfully!"