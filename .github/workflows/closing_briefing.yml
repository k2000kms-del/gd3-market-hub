name: 🌙 GD 3.0 Closing Briefing (15:40 KST Sharp)

on:
  schedule:
    # 한국 시간 평일 15:40, 15:45, 15:50 (UTC 06:40, 06:45, 06:50, 월~금)
    # 정규장 마감(15:30) 및 동시호가 정리 직후 15:40 정각에 텔레그램 결산 발송
    - cron: '40 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '50 6 * * 1-5'
  workflow_dispatch:

jobs:
  closing-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Closing Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: python send_closing_briefing.py

      - name: Commit and push briefing state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_briefing_state.json
          git diff --staged --quiet || git commit -m "chore: 장마감 브리핑 발송 상태 기록"
          git push || true
