name: Scheduled Market Briefings (Morning & Closing)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '발송 모드 (auto, morning, closing)'
        required: false
        default: 'auto'
  schedule:
    # ── 1. 🇺🇸 [07:00 KST] 미장 마감 리포트 & 데일리 보드 (UTC 22:00~22:20 일~목) ──
    - cron: '00,10,20 22 * * 0-4'
    # ── 2. ☀️ [07:40~08:10 KST] 아침 출근 모닝 브리핑 (UTC 22:45~23:20 일~목) ──
    - cron: '45,55 22 * * 0-4'
    - cron: '10,25 23 * * 0-4'
    # ── 3. 🌙 [15:40 KST] 장 마감 결산 브리핑 (UTC 06:35~07:10 월~금) ──
    - cron: '35,45,55 6 * * 1-5'
    - cron: '10 7 * * 1-5'
    # ── 4. 🎯 [17:33 KST] 오늘의 관심 종목 TOP 5 엄선 (UTC 08:20~08:40 월~금) ──
    - cron: '20,35 8 * * 1-5'
    # ── 5. 📋 [18:20 KST] 검증된 조건 해당 종목 공시 (UTC 09:20~09:35 월~금) ──
    - cron: '20,35 9 * * 1-5'
    # ── 6. 🌙 [20:30 KST] 미장 개장 전 확인 5가지 (UTC 11:30~11:45 월~금) ──
    - cron: '30,45 11 * * 1-5'
    # ── 7. 📊 [토요일 18:00 KST] THE DESK 주간 결산 5장 카드뉴스 슬라이드 앨범 (UTC 09:00 토) ──
    - cron: '00,15 9 * * 6'

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy toml

      - name: Run Dedicated Briefing Sender
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "morning" ]; then
            python cloud_runner.py --force-morning --briefing-only
          elif [ "$MODE" = "closing" ]; then
            python cloud_runner.py --force-closing --briefing-only
          else
            python cloud_runner.py --briefing-only
          fi

      - name: Commit and push briefing state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/last_briefing_state.json streamlit_app/data/last_briefing_state.json || true
          git diff --staged --quiet || git commit -m "chore: 브리핑 발송 상태 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git pull --rebase origin main || true
          git push origin main || true
